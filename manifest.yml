app:
  id: ari:cloud:ecosystem::app/ca48e5af-87ae-4520-9e1a-477cd91cd4ef
  runtime:
    name: nodejs22.x
modules:
  jira:issuePanel:
    - key: qa-agent-panel
      title: "Apporto - QA Test Case Generator"
      icon: https://raw.githubusercontent.com/tusha-apportoQA/QA-Agent/main/apporto_qa_icon_v2.svg
      render: native
      resource: frontend
      resolver:
        function: backend-resolver
  jira:issueContext:
    - key: qa-agent-context
      title: "QA Test Case Generator"
      label: "QA Test Cases"
      render: native
      resource: frontend
      resolver:
        function: backend-resolver
  function:
    - key: backend-resolver
      handler: index.handler
resources:
  - key: frontend
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
  external:
    fetch:
      backend:
        - address: "https://api.anthropic.com"
    images:
      - address: "https://raw.githubusercontent.com"